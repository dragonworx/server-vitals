# Server Vitals endpoints — proxied to the local Server Vitals server (127.0.0.1:9999).
# Included from server blocks via `include snippets/server-vitals.conf;`.
#
# SECURITY: these endpoints expose host CPU / memory / disk / load / uptime with
# NO authentication. That is reconnaissance-grade information — do not publish it
# to the open internet. Restrict access in EACH location below, by IP allowlist:
#
#     allow 203.0.113.0/24;   # your office / VPN range
#     allow 127.0.0.1;
#     deny  all;
#
# or with HTTP basic auth:
#
#     auth_basic           "Server Vitals";
#     auth_basic_user_file /etc/nginx/.htpasswd;   # htpasswd -c <file> <user>
#
# The blocks below ship locked to localhost only — widen deliberately.

location = /health {
    access_log off;
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://127.0.0.1:9999/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 2s;
}

location = /stats {
    access_log off;
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://127.0.0.1:9999/stats$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 2s;
}

location = /ping {
    access_log off;
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://127.0.0.1:9999/ping;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 2s;
}

# Access-log panel. Only needed if you have configured a log provider (nginx's
# own access log, or Caddy's if you run both); drop this block otherwise.
#
# EXTRA SECURITY WEIGHT: unlike the blocks above, this one serves visitor IPs,
# request paths, referrers and user-agents for every site the configured
# providers cover. Treat it as more sensitive than the metrics, not less.
#
# Prefix match, so it covers /logs, /logs/servers and /logs/providers alike. The
# panel polls this several times a second — keep access_log off or it will fill
# your nginx log (and the panel would then be watching itself).
location /logs {
    access_log off;
    allow 127.0.0.1;
    deny  all;
    proxy_pass http://127.0.0.1:9999$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 2s;
}
