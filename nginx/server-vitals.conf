# Server Vitals endpoints — proxied to the local Server Vitals server (127.0.0.1:9999).
# Included from server blocks via `include snippets/server-vitals.conf;`.

location = /health {
    access_log off;
    proxy_pass http://127.0.0.1:9999/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 2s;
}

location = /code-server {
    access_log off;
    proxy_pass http://127.0.0.1:9999/code-server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 2s;
}

location = /stats {
    access_log off;
    proxy_pass http://127.0.0.1:9999/stats$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 2s;
}
